name: Bug report
description: Something in Hamal doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting it. The more of this you fill in, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: /hamal status
      description: >
        At the mailbox, type `/hamal status` in the chat and paste the lines here, or drop a
        screenshot of them. They show your realm, your bank alts and the last error, if any.
  - type: textarea
    id: error
    attributes:
      label: Lua error
      description: If the game (or BugSack) showed a Lua error, paste it here.
      render: text
  - type: input
    id: version
    attributes:
      label: Hamal version
      description: The first line of `/hamal status`, or the bottom of the Options tab.
  - type: input
    id: addons
    attributes:
      label: Mail, bag and UI addons you use
      description: For example Postal, TSM, Bagnon, ElvUI. Hamal works on its own, but other mail windows can get in its way.
