# Push a tag like v0.1.0 to build the addon zip and upload it.
# Uploads to CurseForge with the CF_API_TOKEN secret (project id in Hamal.toc). For Wago too,
# add a WAGO_API_TOKEN secret and a "## X-Wago-ID" line in Hamal.toc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
